<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peraturan Forsaken Indonesia Competition</title>
<style>
:root{--ink:#1d1b1b;--muted:#6a6360;--paper:#fbfaf9;--rule:#e4dfdc;--red:#9b1c1c;--warn:#fff1d6;--warn-ink:#5a3300;--info:#e6f0f4;--info-ink:#1b4452}
@media(prefers-color-scheme:dark){:root{--ink:#ece8e6;--muted:#a79f9b;--paper:#161313;--rule:#322c2b;--red:#e06868;--warn:#3a2c10;--warn-ink:#ffd98a;--info:#142a33;--info-ink:#a9d6e6}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
a{color:var(--red)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1100px;margin:0 auto}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:32px 24px;border-right:1px solid var(--rule);font:15px/1.4 system-ui,sans-serif}
nav .brand{font-weight:700;font-size:16px;margin:0 0 18px;color:var(--ink);text-decoration:none;display:block}
nav ul{list-style:none;margin:0;padding:0}
nav li a{display:block;padding:6px 10px;margin:0 -10px;border-radius:4px;color:var(--muted);text-decoration:none}
nav li a:hover{color:var(--ink)}
nav li a.active{color:var(--red);font-weight:600;background:color-mix(in srgb,var(--red) 8%,transparent)}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.language-control{display:flex;align-items:center;gap:5px;margin:0 0 20px;padding:4px;border:1px solid var(--rule);border-radius:8px;width:max-content}
.language-control button{border:0;border-radius:5px;padding:6px 13px;background:transparent;color:var(--muted);font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.05em;cursor:pointer}
.language-control button[aria-pressed="true"]{background:var(--red);color:#fff}
main{padding:40px 48px 80px;max-width:820px}
h1{font:700 2.1rem/1.2 system-ui,sans-serif;margin:0 0 6px}
.meta{color:var(--muted);font:14px system-ui,sans-serif;margin:0 0 28px}
h2{font:700 1.5rem/1.3 system-ui,sans-serif;margin:48px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
h3{font:700 1.1rem/1.3 system-ui,sans-serif;margin:28px 0 8px;color:var(--red)}
ul.r{padding-left:1.3em;margin:10px 0}
ul.r li{margin:6px 0}
.note{padding:12px 16px;margin:16px 0;border-radius:4px;font:15px/1.55 system-ui,sans-serif}
.warn{background:var(--warn);color:var(--warn-ink);border-left:4px solid #d98a00;font-weight:600}
.info{background:var(--info);color:var(--info-ink);border-left:4px solid #3b8aa6}
.ex{color:var(--muted);font-size:15px;margin:4px 0 8px}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font:14px system-ui,sans-serif}
/* Quick access buttons */
.quick-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:22px 0 24px;
  font:600 14px/1.3 system-ui,sans-serif;
}
.quick-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:10px 15px;
  border:1px solid var(--red);
  border-radius:7px;
  color:var(--red);
  text-decoration:none;
  transition:background .18s ease,color .18s ease;
}
.quick-button.primary{background:var(--red);color:#fff}
.quick-button:hover{background:var(--red);color:#fff}

/* Search rules */
.search-panel{
  margin:24px 0 10px;
  font:600 14px/1.4 system-ui,sans-serif;
}
.search-panel label{display:block;margin-bottom:8px}
.search-panel input{
  display:block;
  width:100%;
  min-height:42px;
  padding:10px 13px;
  border:1px solid var(--rule);
  border-radius:7px;
  background:var(--paper);
  color:var(--ink);
  font:15px system-ui,sans-serif;
}
.search-panel input:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}
.search-empty{
  margin:10px 0 20px;
  color:var(--muted);
  font:14px/1.5 system-ui,sans-serif;
}
[hidden]{display:none !important}

/* Collapsible FAQ */
ul.faq-list{list-style:none;padding-left:0}
.faq-list>li{margin:10px 0}
.faq-item{
  border:1px solid var(--rule);
  border-radius:8px;
  padding:0 14px;
}
.faq-item summary{
  position:relative;
  padding:13px 28px 13px 0;
  cursor:pointer;
  font:600 15px/1.5 system-ui,sans-serif;
  list-style:none;
}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{
  content:"+";
  position:absolute;
  right:2px;
  top:50%;
  transform:translateY(-50%);
  color:var(--red);
  font-size:20px;
  line-height:1;
}
.faq-item[open] summary::after{content:"−"}
.faq-answer{
  padding:0 0 14px;
  color:var(--muted);
  font:15px/1.6 system-ui,sans-serif;
}

@media(max-width:800px){.layout{display:block}nav{position:static;height:auto;border:0;border-bottom:1px solid var(--rule);padding:16px 20px}nav ul{display:flex;flex-wrap:wrap;gap:4px 14px}nav li a{margin:0;padding:4px 0}.language-control{margin-bottom:14px}main{padding:24px 20px 60px}}
</style>

function applyRuleSearch() {
  const input = document.getElementById("ruleSearch");
  const emptyMessage = document.getElementById("searchEmpty");
  if (!input || !emptyMessage) return;

  const language = document.documentElement.lang || "id";
  const query = input.value.trim().toLocaleLowerCase(language);
  let visibleSections = 0;

  document.querySelectorAll("main h2").forEach((heading) => {
    const sectionNodes = [];
    let node = heading.nextElementSibling;

    while (node && node.tagName !== "H2" && node.tagName !== "FOOTER") {
      sectionNodes.push(node);
      node = node.nextElementSibling;
    }

    const headingMatches = !query ||
      heading.textContent.toLocaleLowerCase(language).includes(query);
    let sectionHasMatch = false;

    sectionNodes.forEach((block) => {
      if (block.matches("ul.r")) {
        let visibleItems = 0;

        [...block.children].forEach((item) => {
          const itemMatches = !query || headingMatches ||
            item.textContent.toLocaleLowerCase(language).includes(query);
          item.hidden = !itemMatches;
          if (itemMatches) visibleItems++;
        });

        block.hidden = visibleItems === 0;
        if (visibleItems > 0) sectionHasMatch = true;
      } else {
        const blockMatches = !query || headingMatches ||
          block.textContent.toLocaleLowerCase(language).includes(query);
        block.hidden = !blockMatches;
        if (blockMatches) sectionHasMatch = true;
      }
    });

    const sectionVisible = !query || headingMatches || sectionHasMatch;
    heading.hidden = !sectionVisible;

    const navLink = [...document.querySelectorAll("nav li a")]
      .find((link) => link.getAttribute("href") === `#${heading.id}`);
    if (navLink) navLink.parentElement.hidden = !sectionVisible;

    if (sectionVisible) visibleSections++;
  });

  emptyMessage.hidden = !query || visibleSections > 0;
}

const ruleSearchInput = document.getElementById("ruleSearch");
if (ruleSearchInput) {
  ruleSearchInput.addEventListener("input", applyRuleSearch);
}

const languageButtons = [...document.querySelectorAll(".language-button")];

function setLanguage(language) {
  const dictionary = translations[language] || translations.id;
  document.documentElement.lang = language;

  document.querySelectorAll("[data-i18n]").forEach((element) => {
    const key = element.dataset.i18n;
    if (Object.prototype.hasOwnProperty.call(dictionary, key)) {
      element.innerHTML = dictionary[key];
    }
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
    const key = element.dataset.i18nPlaceholder;
    if (Object.prototype.hasOwnProperty.call(dictionary, key)) {
      element.setAttribute("placeholder", dictionary[key]);
    }
  });

  applyRuleSearch();

  languageButtons.forEach((button) => {
    const selected = button.dataset.language === language;
    button.setAttribute("aria-pressed", String(selected));
  });

  document.querySelector("nav").setAttribute(
    "aria-label",
    language === "id" ? "Daftar isi" : "Table of contents"
  );
  document.querySelector(".language-control").setAttribute(
    "aria-label",
    language === "id" ? "Pilih bahasa" : "Select language"
  );
  document.querySelector(".quick-actions").setAttribute(
    "aria-label",
    language === "id" ? "Tautan cepat" : "Quick links"
  );
  document.title = language === "id"
    ? "Peraturan Forsaken Indonesia Competition"
    : "Forsaken Indonesia Competition Rules";

  try {
    localStorage.setItem("fic-language", language);
  } catch (error) {
    // Language switching still works when browser storage is unavailable.
  }
}

languageButtons.forEach((button) => {
  button.addEventListener("click", () => setLanguage(button.dataset.language));
});

let initialLanguage = "id";
try {
  const savedLanguage = localStorage.getItem("fic-language");
  if (savedLanguage === "id" || savedLanguage === "en") {
    initialLanguage = savedLanguage;
  }
} catch (error) {
  // Use Indonesian by default when browser storage is unavailable.
}
setLanguage(initialLanguage);

const links = [...document.querySelectorAll("nav li a")];
const map = new Map(links.map((a) => [a.getAttribute("href").slice(1), a]));
const io = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      links.forEach((link) => link.classList.remove("active"));
      map.get(entry.target.id)?.classList.add("active");
    }
  });
}, {rootMargin:"0px 0px -70% 0px"});
document.querySelectorAll("main h2").forEach((heading) => io.observe(heading));
</script>
